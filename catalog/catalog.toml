# ghdeb 包目录 (Known Packages Catalog)
# 格式：[短名称] + repo / pretty_name / website / summary
#
# 默认仅内置 ghdeb 自身。
# 其余条目由 `ghdeb scan` 根据系统已装包 + GitHub Releases 自动发现与清理。
# 也可手动编辑 /etc/ghdeb/catalog.toml 添加系统级条目

[ghdeb]
repo = "LeisureLinux/ghdeb"
pretty_name = "ghdeb"
website = "https://github.com/LeisureLinux/ghdeb"
summary = "管理从 GitHub Releases 下载的 .deb 包"
