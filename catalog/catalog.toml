# ghdeb 包目录 (Known Packages Catalog)
# 格式：[短名称] + repo / pretty_name / website / summary
#
# 用户可在 ~/.config/ghdeb/catalog.toml 添加自定义条目（同名覆盖）
# 也可在 /etc/ghdeb/catalog.toml 添加系统级条目

# === 开发工具 ===

[bat]
repo = "sharkdp/bat"
pretty_name = "bat"
website = "https://github.com/sharkdp/bat"
summary = "A cat(1) clone with syntax highlighting and Git integration"

[fd]
repo = "sharkdp/fd"
pretty_name = "fd-find"
website = "https://github.com/sharkdp/fd"
summary = "A simple, fast and user-friendly alternative to find"

[ripgrep]
repo = "BurntSushi/ripgrep"
pretty_name = "ripgrep"
website = "https://github.com/BurntSushi/ripgrep"
summary = "An extremely fast grep alternative"

[gh]
repo = "cli/cli"
pretty_name = "GitHub CLI"
website = "https://cli.github.com"
summary = "GitHub's official command line tool"

[lazygit]
