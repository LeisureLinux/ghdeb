# ghdeb 包目录 (Known Packages Catalog): /etc/ghdeb/catalog.toml
# 格式：[短名称] + repo / pretty_name / website / summary
#

[ghdeb]
repo = "LeisureLinux/ghdeb"
pretty_name = "ghdeb"
website = "https://github.com/LeisureLinux/ghdeb"
summary = "管理从 GitHub Releases 下载的 .deb 包"
